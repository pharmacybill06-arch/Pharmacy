[build]
  base    = "my-react-app"
  command = "npm run build"
  publish = "build"

[build.environment]
  # Set REACT_APP_BACKEND_URL in Netlify dashboard → Site Settings → Environment Variables
  # Example: https://your-backend.onrender.com/api
  CI = "false"

# Redirect all routes to index.html so React Router works on hard refresh
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
